name: Link Validator

on:
  workflow_dispatch:
    inputs:
      csv_file:
        description: CSV file path in the repo (relative)
        required: false
        default: url-temp.csv
      mode:
        description: Run mode: desktop, mobile, unified
        required: false
        default: unified
  # Uncomment to run automatically (UTC).
  # schedule:
  #   - cron: "0 9 * * 1-5"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run link validator
        env:
          CSV_FILE: ${{ github.event.inputs.csv_file }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail

          CSV_FILE="${CSV_FILE:-url-temp.csv}"
          MODE="${MODE:-unified}"

          ARGS=(--file "$CSV_FILE")

          if [ "$MODE" = "mobile" ]; then
            ARGS+=(--mobile)
          elif [ "$MODE" = "unified" ]; then
            ARGS+=(--unified)
          fi

          npm run link-validate -- "${ARGS[@]}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-validator-reports
          path: |
            Reports
            reports